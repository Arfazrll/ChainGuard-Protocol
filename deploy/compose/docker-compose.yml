# ChainGuard, self-hosted in one command.
#
#   docker compose -f deploy/compose/docker-compose.yml up --build
#
# By default the engine replays two real incidents (the USDC depeg and the
# Euler Finance exploit, captured from mainnet), so alerts, risk scores and
# the audit chain appear within seconds. No RPC endpoint or key needed.
#
#   Dashboard  http://localhost:4300      Landing  http://localhost:4400
#   Engine     http://localhost:4000/api/health
#   Reports    http://localhost:8800/reports/alerts/<id>.pdf
#
# Live Ethereum mainnet instead (two independent RPC providers):
#
#   export CHAINGUARD_RPC_A=https://ethereum-rpc.publicnode.com
#   export CHAINGUARD_RPC_B=https://eth.drpc.org
#   CHAINGUARD_SOURCE=kafka docker compose -f deploy/compose/docker-compose.yml --profile live up --build
#
# Verified by the `compose` job in .github/workflows/ci.yml.

name: chainguard

x-secret: &secret_key_base
  # Demo value. Set CHAINGUARD_SECRET_KEY_BASE (mix phx.gen.secret) for anything shared.
  SECRET_KEY_BASE: ${CHAINGUARD_SECRET_KEY_BASE:-demo-only-chainguard-secret-key-base-change-me-0123456789abcdefghijklmnopqrstuvwxyz}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: chainguard
      POSTGRES_PASSWORD: ${CHAINGUARD_DB_PASSWORD:-chainguard}
      POSTGRES_DB: chainguard
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chainguard -d chainguard"]
      interval: 3s
      timeout: 3s
      retries: 30

  anomaly:
    build:
      context: ../..
      dockerfile: deploy/docker/python-service.Dockerfile
      args: { SERVICE: anomaly }
    command: ["chainguard-anomaly", "serve", "--host", "0.0.0.0", "--port", "8700"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8700/healthz')"]
      interval: 3s
      timeout: 3s
      retries: 30

  engine:
    build:
      context: ../..
      dockerfile: deploy/docker/engine.Dockerfile
    environment:
      <<: *secret_key_base
      PHX_HOST: localhost
      CHAINGUARD_DATABASE_URL: postgres://chainguard:${CHAINGUARD_DB_PASSWORD:-chainguard}@postgres/chainguard
      CHAINGUARD_SOURCE: ${CHAINGUARD_SOURCE:-jsonl}
      CHAINGUARD_JSONL_PATH: /app/replay/incidents.jsonl
      CHAINGUARD_JSONL_MODE: replay
      CHAINGUARD_KAFKA_HOSTS: redpanda:9092
      CHAINGUARD_ANOMALY_URL: http://anomaly:8700
    ports:
      - "4000:4000"
    depends_on:
      postgres: { condition: service_healthy }
      anomaly: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "bin/chain_guard rpc 'IO.puts(:ok)' >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 40

  report:
    build:
      context: ../..
      dockerfile: deploy/docker/python-service.Dockerfile
      args: { SERVICE: report }
    command: ["chainguard-report", "--engine", "http://engine:4000", "serve", "--host", "0.0.0.0", "--port", "8800"]
    ports:
      - "8800:8800"
    depends_on:
      engine: { condition: service_healthy }

  dashboard:
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
      args: { APP: dashboard, OUT: dist/dashboard/browser }
    ports:
      - "4300:80"

  landing:
    build:
      context: ../..
      dockerfile: deploy/docker/web.Dockerfile
      args: { APP: landing, OUT: build }
    ports:
      - "4400:80"

  # --- live mainnet (profile "live") -----------------------------------------------
  redpanda:
    profiles: [live]
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --mode=dev-container
      - --smp=1
      - --kafka-addr=internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr=internal://redpanda:9092,external://localhost:19092
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health", "--exit-when-healthy"]
      interval: 5s
      timeout: 10s
      retries: 20

  ingestd:
    profiles: [live]
    build:
      context: ../..
      dockerfile: deploy/docker/ingestd.Dockerfile
    environment:
      CHAINGUARD_RPC_A: ${CHAINGUARD_RPC_A:?set CHAINGUARD_RPC_A to an Ethereum RPC URL}
      CHAINGUARD_RPC_B: ${CHAINGUARD_RPC_B:?set CHAINGUARD_RPC_B to a second, independent RPC URL}
      CHAINGUARD_LOG_FORMAT: json
    command: ["--config", "/app/config/ingestd.compose.toml"]
    volumes:
      - ingestd-state:/var/lib/chainguard
    depends_on:
      redpanda: { condition: service_healthy }
    # Exit code 2 = integrity halt. It persists in the checkpoint, so restarts
    # exit again immediately until an operator runs --clear-halt; the cap
    # stops a restart loop.
    restart: on-failure:5

  clickhouse:
    profiles: [live]
    image: clickhouse/clickhouse-server:24.8
    environment:
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "8123:8123"
    volumes:
      - ../clickhouse:/docker-entrypoint-initdb.d:ro
      - clickhouse-data:/var/lib/clickhouse
    depends_on:
      redpanda: { condition: service_healthy }

volumes:
  postgres-data:
  clickhouse-data:
  ingestd-state:
