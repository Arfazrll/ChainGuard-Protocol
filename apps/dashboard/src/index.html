<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>SvlteChain: live risk monitor</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="SvlteChain live on-chain risk monitor. Read-only by design.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="alternate icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    // Apply the saved theme before first paint, so the page never flashes the wrong one.
    try {
      var t = localStorage.getItem('svltechain-theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset['theme'] = t;
    } catch (e) {}
  </script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
