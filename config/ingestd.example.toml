# ChainGuard ingestion — Ethereum mainnet over two independent public RPCs.
# Copy to config/ingestd.toml and adjust. Run: cargo run -p chainguard-ingestd -- -c config/ingestd.toml

chain_id = 1
chain_name = "ethereum-mainnet"

# A block is final once it is this many blocks deep (~2 epochs on PoS
# Ethereum). Records are emitted immediately as *provisional* and are
# retracted if a reorg orphans their block before then.
confirmations = 64
poll_interval_ms = 2000
request_timeout_ms = 10000
# start_block = 21000000   # omit to start at the current head

# Top-level keys must come before any [table] in TOML.
labels = "data/labels/ethereum-mainnet.json"
checkpoint = "var/ingestd-ethereum-mainnet.checkpoint.json"

# Never trust a single node: every head, header and log set must be returned
# identically by at least `min_agreement` nodes (a strict majority).
[quorum]
min_agreement = 2
allow_single_source = false

# Use independent providers. Keep API keys out of this file: `url_env` reads
# the URL from an environment variable injected by your secret store.
[[nodes]]
id = "publicnode"
url = "https://ethereum-rpc.publicnode.com"

[[nodes]]
id = "drpc"
url = "https://eth.drpc.org"

# [[nodes]]
# id = "alchemy"
# url_env = "CHAINGUARD_ALCHEMY_URL"

[sink]
kind = "jsonl"
path = "-"

# [sink]
# kind = "kafka"
# brokers = ["localhost:19092"]
# topic = "chainguard.ingest.v1.ethereum-mainnet"

# Price at block time from Chainlink: each `AnswerUpdated` from an aggregator
# re-prices `token` for every later record. Aggregators rotate behind their
# proxy; resolve the current one with `aggregator()` on the proxy (on two
# providers) when updating. A token has no oracle price until its feed's
# first update after start (ETH/USD updates on a 0.5% move or hourly).
[[oracle_feeds]]   # ETH/USD → WETH
aggregator = "0x7d4E742018fb52E48b08BE73d041C18B21de6Fb5"
token = "0xC02aaA39b223FE8D0A0e5C4F27eAD9083C756Cc2"
answer_decimals = 8

[[oracle_feeds]]   # USDC/USD → USDC (replaces the $1 peg assumption once seen)
aggregator = "0x54bCC589d9743E521c64233706FC8cB36D275b07"
token = "0xA0b86991c6218b36c1d19D4a2e9Eb0cE3606eB48"
answer_decimals = 8

[[oracle_feeds]]   # USDT/USD → USDT
aggregator = "0x9c41663bB8d6800c8050E2Fbf98E86AD01c973e3"
token = "0xdAC17F958D2ee523a2206206994597C13D831ec7"
answer_decimals = 8

[[oracle_feeds]]   # DAI/USD → DAI
aggregator = "0x709783ab12b65fD6cd948214EEe6448f3BdD72A3"
token = "0x6B175474E89094C44Da98b954EedeAC495271d0F"
answer_decimals = 8
