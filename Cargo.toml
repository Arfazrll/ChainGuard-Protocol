[workspace]
resolver = "3"
members = ["crates/ingest-core", "crates/rpc", "crates/ingestd"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

# Pinned to exact versions (supply-chain hygiene, see Section 11 of the brief).
# Deliberately NO signer / wallet / keystore crates anywhere in this workspace;
# scripts/check-invariants.sh fails CI if one enters the build graph.
[workspace.dependencies]
alloy-primitives = { version = "=1.7.3", default-features = false, features = ["std", "serde"] }
alloy-sol-types = { version = "=1.7.3", default-features = false, features = ["std"] }
tokio = { version = "=1.54.1", features = ["rt", "macros", "time", "sync"] }
futures = "=0.3.34"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
thiserror = "=2.0.21"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
anyhow = "=1.0.104"
clap = { version = "=4.6.7", features = ["derive"] }
toml = "=1.2.1"
reqwest = { version = "=0.13.5", default-features = false, features = ["json", "rustls"] }
rskafka = { version = "=0.6.0", default-features = false }
proptest = "=1.12.0"

chainguard-ingest-core = { path = "crates/ingest-core" }
chainguard-rpc = { path = "crates/rpc" }

[profile.release]
lto = "thin"
codegen-units = 1
