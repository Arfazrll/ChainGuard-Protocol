name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: fmt · clippy · test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked --no-fail-fast

  # Merge is blocked if read-only enforcement, multi-node verification, the
  # reorg suite or the ML severity ceiling is removed, weakened or bypassed
  # (brief §1, §16).
  invariants:
    name: invariants (read-only · multi-node · reorg · audit · tenants)
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: chainguard
          POSTGRES_PASSWORD: chainguard
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chainguard" --health-interval 3s
          --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: mix deps.get
        working-directory: apps/engine
      - run: scripts/check-invariants.sh

  # Milestone-1 acceptance: a reorg on a real test chain retracts and
  # re-emits derived state.
  anvil-reorg:
    name: reorg on a real test chain (anvil)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - name: start anvil
        run: |
          anvil --port 8545 --silent &
          for i in $(seq 1 30); do
            curl -sf -X POST -H 'content-type: application/json' \
              --data '{"jsonrpc":"2.0","id":1,"method":"eth_chainId","params":[]}' \
              http://127.0.0.1:8545 && break
            sleep 1
          done
      - run: cargo test -p chainguard-rpc --test anvil_reorg --locked -- --ignored
        env:
          CHAINGUARD_ANVIL_URL: http://127.0.0.1:8545

  # Detection engine: rules, alerting, Broadway pipeline, and the replay of
  # real historical incidents (test/fixtures/incidents) as regression tests.
  engine:
    name: engine (Elixir) · incident replay
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: chainguard
          POSTGRES_PASSWORD: chainguard
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U chainguard" --health-interval 3s
          --health-timeout 3s --health-retries 30
    defaults:
      run:
        working-directory: apps/engine
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        with:
          otp-version: "29"
          elixir-version: "1.20"
      - uses: actions/cache@v4
        with:
          path: |
            apps/engine/deps
            apps/engine/_build
          key: mix-${{ runner.os }}-${{ hashFiles('apps/engine/mix.lock') }}
      - run: mix deps.get
      - run: mix format --check-formatted
      - run: mix compile --warnings-as-errors
      - run: mix test

  dashboard:
    name: dashboard (Angular)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/dashboard/package-lock.json
      - run: npm ci
      - run: npx ng build
      - run: npx ng test --watch=false

  # ML lane: models, reorg unlearning, HTTP API, and the replay of real
  # mainnet blocks before the Euler exploit.
  anomaly:
    name: ML service (Python) · real-data replay
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/anomaly
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: services/anomaly/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check src tests scripts
      - run: uv run ruff format --check src tests scripts
      - run: uv run pytest

  report:
    name: report service (Python)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: services/report
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: services/report/uv.lock
      - run: uv sync --locked
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run pytest

  # Milestone 4 acceptance: a stranger self-hosts with one command and sees
  # alerts. Builds every image, starts the stack, and checks the replayed
  # incidents end to end: alerts, risk score, audit chain, PDF report, UIs.
  compose:
    name: self-host in one command (docker compose)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: docker compose up
        run: docker compose -f deploy/compose/docker-compose.yml up -d --build --wait --wait-timeout 900
      - name: alerts, risk score, audit chain, report, front ends
        run: |
          set -euo pipefail
          api=http://localhost:4000/api
          for i in $(seq 1 90); do
            n=$(curl -sf $api/alerts | jq '.alerts | length' || echo 0)
            [ "$n" -ge 3 ] && break
            sleep 2
          done
          curl -sf $api/alerts | jq -e '[.alerts[] | select(.rule_id == "flash-loan-drain" and .severity == "critical")] | length == 1'
          curl -sf $api/alerts | jq -e '[.alerts[] | select(.rule_id == "usdc-peg" and .severity == "high")] | length == 1'
          curl -sf $api/scores | jq -e '.scores[] | select(.protocol == "euler") | .band == "critical"'
          curl -sf $api/audit/verify | jq -e '.valid == true and .entries > 0'
          id=$(curl -sf $api/alerts | jq -r '[.alerts[] | select(.rule_id == "flash-loan-drain")][0].id')
          curl -sf -o report.pdf http://localhost:8800/reports/alerts/$id.pdf
          head -c 4 report.pdf | grep -q '%PDF'
          curl -sf http://localhost:4300/ | grep -qi '<app-root'
          curl -sf http://localhost:4400/ | grep -q 'ChainGuard'
      - name: logs on failure
        if: failure()
        run: docker compose -f deploy/compose/docker-compose.yml logs --no-color --tail 200
      - if: always()
        run: docker compose -f deploy/compose/docker-compose.yml down -v

  landing:
    name: landing page (SvelteKit)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: apps/landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/landing/package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
