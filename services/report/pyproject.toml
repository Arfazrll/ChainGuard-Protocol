[project]
name = "chainguard-report"
version = "0.1.0"
description = "Compliance-ready PDF reports for ChainGuard alerts, with an independent check of the audit hash chain."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "reportlab>=4.4",
]

[project.scripts]
chainguard-report = "chainguard_report.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chainguard_report"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[dependency-groups]
dev = [
    "pypdf>=7.0.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff.lint.per-file-ignores]
# PDF markup strings read better unwrapped.
"src/chainguard_report/render.py" = ["E501"]
"tests/*" = ["E501"]
