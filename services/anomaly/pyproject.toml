[project]
name = "chainguard-anomaly"
version = "0.1.0"
description = "ChainGuard ML lane: per-protocol flow baselines, fund-flow graph anomalies and novel event patterns, served to the detection engine over HTTP."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.2",
    "scikit-learn>=1.6",
]

[project.scripts]
chainguard-anomaly = "chainguard_anomaly.__main__:main"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/chainguard_anomaly"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
